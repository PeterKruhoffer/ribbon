packages:
  - .

# Fail closed on new releases, unknown publish dates, and trust downgrades.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Legacy releases can predate consistent provenance across major branches.
# Keep downgrade checks for releases from the last 30 days.
trustPolicyIgnoreAfter: 43200
trustLockfile: false
blockExoticSubdeps: true

# New install scripts require a reviewed decision, even in CI.
strictDepBuilds: true
allowBuilds:
  # The optional platform package already contains the binary. No downloader needed.
  workerd@1.20260918.1: false
verifyDepsBeforeRun: error
skills:
  dirs: []

# The Vite+ core reports its toolchain version, not the Vite version it contains.
peerDependencyRules:
  allowedVersions:
    vite: 1.6.0

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.6.0
  "@effect/platform-node-shared": 4.0.2
  "@effect/sql-d1": 4.0.2
  "@effect/sql-sqlite-do": 4.0.2
  unenv: 2.0.0-rc.24
  # Patched releases for Dependabot alerts. alchemy 2.0.0-beta.81 pulls these in
  # through @prisma/dev, which only the Alchemy CLI loads. Remove these after
  # moving to alchemy beta.84 or later, which drops @prisma/dev.
  hono: 4.13.18
  "@hono/node-server": 2.1.8
  lodash: 4.18.1
  valibot: 1.5.0
