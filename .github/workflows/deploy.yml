# Deploys main to the `prod` stage on every push, then checks it end to end.
# When the deploy or the checks fail, it redeploys the last commit that passed.
# See docs/development.md, "Deploy from CI".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  # The rollback step reads earlier runs to find the last commit that passed.
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prod
      url: ${{ steps.url.outputs.url }}
    env:
      ALCHEMY_STAGE: prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Clerk development instance's keys are public and live in .env.example.
      # Vite and Alchemy both read .env.
      - run: cp .env.example .env
      - run: pnpm check
      # Build before deploying, so a broken build fails before anything changes.
      - run: pnpm build
      - id: deploy
        run: pnpm run deploy --yes --no-input
      - id: url
        run: |
          url=$(pnpm exec alchemy state cat "Ribbon/$ALCHEMY_STAGE/output" --no-input --log-level error 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s.slice(s.indexOf("{"))).url))')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: verify:live
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::warning::CLERK_SECRET_KEY is not set, so verify:live was skipped"
            exit 0
          fi
          RIBBON_OWNER_TOKEN=$(node scripts/owner-token.mjs) pnpm verify:live "${{ steps.url.outputs.url }}"
      # Put the last good version back when the deploy or verify:live fails.
      # Skipped when check or build fails, because nothing was deployed yet.
      # The rollback redeploys that commit with Alchemy, so state stays in step,
      # and the run still fails.
      - name: Roll back to the last good commit
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          good=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')
          if [ -z "$good" ]; then
            echo "::error::No earlier deploy passed, so there is nothing to roll back to"
            exit 1
          fi
          echo "Rolling back prod to $good"
          git fetch --depth 1 origin "$good"
          git checkout --force --detach "$good"
          git clean -fdx -e node_modules
          pnpm install --frozen-lockfile
          cp .env.example .env
          pnpm run deploy --yes --no-input
          echo "::error::Deploy of $GITHUB_SHA failed, so prod was rolled back to $good"
          echo "Rolled back to $good after $GITHUB_SHA failed" >> "$GITHUB_STEP_SUMMARY"
